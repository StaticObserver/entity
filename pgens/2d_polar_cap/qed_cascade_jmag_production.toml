# 2D QED cascade production run: full polar cap with the CPT2024
# (arXiv:2409.15409) transverse current profile j_mag.
#
# Normalization (see docs/design.md Sec. 8 for the scaling laws):
#   - Legacy trigger test: larmor0 = 2.5e-7, skindepth0 = 5e-4, n_GJ = 1 n0,
#     dx = 1e-4 (d_e^GJ = 5 dx). Full cap at that normalization does not fit
#     one H100 (quasi-steady macro count scales as n_GJ * cells).
#   - This run: skindepth0 = 1.25e-3 (dx = 2.5e-4, d_e^GJ = 2 dx), larmor0
#     unchanged, so gamma_PC = 8e6, omega_B0, the E/B0 normalization and all
#     code-time dynamics are identical to the trigger test. n_GJ = 6.25 n0
#     (scales as skindepth0^2), so GJ-normalized densities/currents are x6.25
#     and the QED emission/pair coefficients are x2.5 (per-code-length rate
#     invariance: runtime divides both by skindepth0).
#   - Initial E uses the fixed Gauss closure (pgen.hpp InitialFields,
#     2026-08-24): dE/dx = rho * larmor0/skindepth0^2.
#   - ppc0 = 0.1 with weights: initial fill floors at minimum_ppc = 1
#     macro/cell/species with weight 0.625 n0, keeping ~1.6e8 macros/species
#     at t = 0 and leaving headroom for the cascade (multiplicity ~ 3-4x,
#     measured on the trigger test).
#
# Grid: 8000 x 20000 cells over [0,2] x [-2.5,2.5]; cap spans [-2,2]
# (halfwidth = R_PC = 2), 0.25 R_PC vacuum margin each side.
# dt = CFL*dx/sqrt(2) = 4.42e-5; runtime 1.0 = 22626 steps (ignition at
# t ~ 0.1-0.2 by trigger-test calibration, so ~5 post-ignition evolutions).

[simulation]
  name    = "polar_cap_2d_qedon_jmag_philippov2024"
  engine  = "srpic"
  runtime = 1.0

[grid]
  resolution = [8000, 20000]
  extent     = [[0.0, 2.0], [-2.5, 2.5]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["ATMOSPHERE", "MATCH"], ["PERIODIC"]]
    particles = [["ATMOSPHERE", "ABSORB"], ["PERIODIC"]]

    [grid.boundaries.match]
      ds = [[0.05], []]

    [grid.boundaries.atmosphere]
      temperature = 0.1
      # 100 n_GJ (n_GJ = 6.25 n0 at this normalization).
      density     = 625.0
      height      = 0.130288344571
      species     = [1, 2]
      ds          = 0.6

[scales]
  # d_e(n0) = 5 dx = 1.25e-3; d_e^GJ = d_e/sqrt(6.25) = 5e-4 = 2 dx.
  larmor0    = 2.5e-7
  skindepth0 = 1.25e-3

[algorithms]
  current_filters = 32

  [algorithms.timestep]
    CFL = 0.25

[particles]
  ppc0                     = 0.1
  use_weights              = true
  clear_interval           = 100
  spatial_sorting_interval = 0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 4e8
    pusher   = "Boris"
    emission = "custom"

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 4e8
    pusher   = "Boris"
    emission = "custom"

  [[particles.species]]
    label           = "gamma"
    mass            = 0.0
    charge          = 0.0
    maxnpart        = 2e8
    pusher          = "Photon"
    emission        = "none"
    # CustomPostStep reclaims photons after pair conversion.
    clear_interval  = 0
    # epsilon_gamma, tau_pair, theta_B
    n_payloads_real = 3

[setup]
  "polar_cap.B0"                       = -1.0
  "polar_cap.temperature"              = 0.01
  # j_scale = 1 j_GJ = 6.25 n0 q0 c; philippov2024 peak j(0) = 2 j_GJ.
  "polar_cap.external_current"         = 6.25
  "polar_cap.current_profile"          = "philippov2024"
  "polar_cap.current_profile_center"   = 0.0
  "polar_cap.current_profile_halfwidth" = 2.0
  # n_GJ in code units.
  "polar_cap.initial_e_coefficient"    = 6.25
  "polar_cap.extra_positron_density"   = 6.25

  "polar_cap.initial_injection.minimum_density" = 1e-6
  "polar_cap.initial_injection.minimum_ppc"     = 1

  "polar_cap.qed.enable"                        = true
  "polar_cap.qed.curvature_drag"                = true
  "polar_cap.qed.curvature_emission"            = true
  "polar_cap.qed.magnetic_pair_creation"        = true
  "polar_cap.qed.filter_nonconverting_photons"  = true
  "polar_cap.qed.photon_recycle_interval"       = 10
  "polar_cap.qed.rho_c"                         = 10.0
  "polar_cap.qed.gamma_emit"                    = 1.6e4
  "polar_cap.qed.gamma_rad"                     = 1.6e5
  "polar_cap.qed.reference_electric_field"      = 2.0
  "polar_cap.qed.photon_energy_min"             = 2.0
  # x2.5 vs the trigger test: keeps per-code-length rates invariant.
  "polar_cap.qed.emission_coefficient"          = 1.587827219e8
  "polar_cap.qed.pair_coefficient"              = 1.587827219e8
  "polar_cap.qed.b_over_bq"                     = 0.2
  "polar_cap.qed.max_photons_per_particle_step" = 100
  "polar_cap.qed.max_drag_fraction"             = 0.2
  "polar_cap.qed.opacity_substeps"              = 8
  "polar_cap.qed.conversion_optical_depth"      = 1.0
  "polar_cap.qed.spectrum_table"                = "data/curvature_ccdf.tsv"

  # Explicit RR is a separate QED-off mode and must remain disabled here.
  "polar_cap.radiation_reaction.enable" = false

[output]
  format        = "bp"
  interval_time = 0.02

  [output.fields]
    quantities = ["N_1", "N_2", "N_3", "E", "B", "J"]

    [output.fields.smoothing]
      method = "spline"
      order  = 3

  [output.particles]
    enable = false

  [output.spectra]
    enable   = true
    e_min    = 1e0
    e_max    = 1e7
    log_bins = true
    n_bins   = 512

[diagnostics]
  interval        = 500
  colored_stdout  = true
  blocking_timers = true

[checkpoint]
  keep = 0
