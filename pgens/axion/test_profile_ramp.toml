# =============================================================================
# Smoke test T5: ramp density profile along x1
# =============================================================================
# n(x1): linear n_min -> n_max between xa=30 and xb=70, clamped outside.
# Injection varies ppc (probability), particle weights stay 1.
# Check: initial N moment vs analytic ramp; short runtime only.
# =============================================================================

[simulation]
  name    = "test_profile_ramp"
  engine  = "SRPIC"
  runtime = 1.0

[grid]
  resolution = [256, 8]
  extent     = [[0.0, 100.0], [0.0, 3.125]]   # square cells dx = 0.390625

  [grid.metric]
    metric = "Minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"], ["PERIODIC"]]
    particles = [["PERIODIC"], ["PERIODIC"]]

[scales]
  larmor0    = 1e-2
  skindepth0 = 0.5

[algorithms]
  current_filters = 8

  [algorithms.timestep]
    CFL = 1.413

  [algorithms.fieldsolver]
    delta_x = 0.0
    delta_y = 0.0
    beta_xy = 0.125
    beta_yx = 0.125

[particles]
  ppc0        = 16.0
  use_weights = true

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 100000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 100000.0

[setup]
  epsilon     = 1e-2
  omega_ratio = 0.5
  k           = 0.1
  B0          = 1.0
  temperature = 0.01
  density     = 1.0
  profile     = "ramp"
  n_min       = 0.2
  n_max       = 1.0
  ramp_xa     = 30.0
  ramp_xb     = 70.0

[output]
  interval_time = 0.5
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "N"]

    [output.fields.smoothing]
      order  = 3
      method = "spline"

  [output.stats]
    enable        = true
    interval_time = 0.5

[diagnostics]
  log_level = "VERBOSE"
