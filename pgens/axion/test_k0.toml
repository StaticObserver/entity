# =============================================================================
# Vacuum test T2: uniform axion k=0 (AlmostZero branch of InitFields::ex1)
# =============================================================================
# density=0, B0=1, k=0, grad_ae=off.
# Ex1(0) = 0 (k=0 guard). adot = -omega*sin(omega*t), spatially uniform:
#   dE1/dt = eps*omega*B0*sin(omega*t)  ->  Ex1(t) = eps*B0*(1 - cos(omega*t))
# eps=1e-2, B0=1, omega=1 -> max Ex1 = 2e-2 at omega*t = pi.
# =============================================================================

[simulation]
  name    = "test_k0"
  engine  = "SRPIC"
  runtime = 7.0

[grid]
  resolution = [8, 8]
  extent     = [[0.0, 1.0], [0.0, 1.0]]    # square cells dx = 0.125

  [grid.metric]
    metric = "Minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"], ["PERIODIC"]]
    particles = [["PERIODIC"], ["PERIODIC"]]

[scales]
  larmor0    = 1e-2
  skindepth0 = 0.5        # omega = 1.0

[algorithms]
  current_filters = 8

  [algorithms.timestep]
    CFL = 1.413

  [algorithms.fieldsolver]
    delta_x = 0.0
    delta_y = 0.0
    beta_xy = 0.125
    beta_yx = 0.125

[particles]
  ppc0        = 16.0
  use_weights = true

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 100000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 100000.0

[setup]
  epsilon     = 1e-2
  omega_ratio = 0.5
  k           = 0.0
  B0          = 1.0
  temperature = 0.0
  density     = 0.0
  use_grad_a_cross_e = false

[output]
  interval_time = 0.05
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "J", "divE"]

    [output.fields.smoothing]
      order  = 3
      method = "spline"

  [output.stats]
    enable        = true
    interval_time = 0.5

[diagnostics]
  log_level = "VERBOSE"
