# =============================================================================
# Stage 2 - Benchmark: Pair Plasma Screening of Axion-Driven E-field
# =============================================================================
# Neutral e+e- pair plasma in 1D periodic box with uniform B ∥ k.
#
# Control parameters:
#   epsilon_a = g_agamma * a0  = 5.0
#   A         = omega_a/omega_p = 0.5
#   K         = k * d_e         = 0.1
#   sigma     = B0^2/(n_tot*m_e*c^2) = 1
#
# Charge/current supply ratios:
#   eta_rho ~ epsilon_a * K * sqrt(sigma) = 0.5
#   eta_J   ~ epsilon_a * A * sqrt(sigma) = 2.5
# eta_J > 1 → axion demands more current than plasma can provide.
# =============================================================================

[simulation]
  name    = "stage2_benchmark"
  engine  = "srpic"
  runtime = 400.0

[grid]
  resolution = [1024]
  extent     = [[0.0, 62.831853]]   # L = 2*pi/k

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  current_filters = 0

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0 = 128.0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 600000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 600000.0

[setup]
  epsilon     = 5.0       # g_agamma * a0,  eta_J = 2.5
  omega       = 0.5       # A = omega_a/omega_p = 0.5
  k           = 0.1
  B0          = 1.0
  theta       = 0.0        # B ∥ k (most stringent charge-source test)
  temperature = 0.01

[output]
  interval_time = 0.2
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "J", "divE", "N_1", "N_2", "T00"]

  [output.particles]
    enable = true
    interval_time = 10.0

  [output.spectra]
    enable        = true
    interval_time = 10.0

  [output.stats]
    enable        = true
    interval_time = 1.0

[diagnostics]
  log_level = "INFO"

