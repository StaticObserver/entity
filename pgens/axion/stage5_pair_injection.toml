# =============================================================================
# Stage 5 - Pair Injection: Dynamic e+e- Injection via Goldreich-Julian Density
# =============================================================================
# Neutral e+e- pair plasma, 1D periodic, B ∥ k ∥ x₁.
# Pairs are dynamically injected where E_parallel > threshold,
# with density n_GJ = density_factor * |Omega_GJ| * sqrt(B^2) / (2*pi).
#
# Control parameters:
#   ε = 1e-2, A = ω/ω_p = 0.5, K = k·d_e = 0.05, σ = 2500
#
# Supply ratios:
#   η_J = ε·A·√σ = 0.5
#   η_ρ = ε·K·√σ = 0.05
# → both < 1: plasma can easily supply axion-required charge/current
# =============================================================================

[simulation]
  name    = "stage5_pair_injection"
  engine  = "SRPIC"
  runtime = 400.0

[grid]
  resolution = [1024]
  extent     = [[0.0, 62.831853]]   # L = 2*pi/k

  [grid.metric]
    metric = "Minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 1e-2     # σ = (skindepth0/larmor0)² = 2500
  skindepth0 = 0.5

[algorithms]
  current_filters = 0

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0        = 128.0
  use_weights = true     # required by axion PGen

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 600000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 600000.0

[setup]
  epsilon     = 1e-2      # η_J = 0.5, η_ρ = 0.05
  omega_ratio = 0.5       # A = omega_a/omega_p = 0.5
  k           = 0.1
  B0          = 1.0
  theta       = 0.0       # B ∥ k
  temperature = 0.01

  # Pair injection
  pair_injection_enabled       = true
  pair_injection_threshold     = 0.01     # E_∥ trigger (ε=5.0 → E∥ ~ ε)
  pair_injection_pairs_per_cell = 4.0
  Omega_GJ                     = 0.5      # ω_a = 0.5 in code units
  pair_injection_density_factor = 1.0

[output]
  interval_time = 0.2
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "J", "divE", "T00"]

    [output.fields.smoothing]
      order  = 1
      method = "spline"

  [output.particles]
    enable        = true
    interval_time = 10.0

  [output.spectra]
    enable        = true
    interval_time = 10.0

  [output.stats]
    enable        = true
    interval_time = 1.0

[diagnostics]
  log_level = "VERBOSE"
