# =============================================================================
# Vacuum test T3: B0_perp channel (adot*B term in jx2)
# =============================================================================
# density=0, B0=0, B0_perp=1, k=2pi/64, grad_ae=off.
# Only jx2 = coef*eps*omega*sin(k*x1 - omega*t)*Bx2 acts:
#   dE2/dt = -eps*omega*B_perp*sin(k*x1 - omega*t)
#   -> E2 = -eps*B_perp*[cos(k*x1 - omega*t) - cos(k*x1)]
#   -> max_t <E2^2> = 2*(eps*B_perp)^2 = 2.0e-4 at omega*t = pi
# Ex1 must stay identically zero (B0 = 0).
# =============================================================================

[simulation]
  name    = "test_b0perp"
  engine  = "SRPIC"
  runtime = 7.0

[grid]
  resolution = [512, 8]
  extent     = [[0.0, 64.0], [0.0, 1.0]]   # square cells dx = 0.125; one axion wavelength

  [grid.metric]
    metric = "Minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"], ["PERIODIC"]]
    particles = [["PERIODIC"], ["PERIODIC"]]

[scales]
  larmor0    = 1e-2
  skindepth0 = 0.5        # omega = 1.0

[algorithms]
  current_filters = 8

  [algorithms.timestep]
    CFL = 1.413

  [algorithms.fieldsolver]
    delta_x = 0.0
    delta_y = 0.0
    beta_xy = 0.125
    beta_yx = 0.125

[particles]
  ppc0        = 16.0
  use_weights = true

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 100000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 100000.0

[setup]
  epsilon     = 1e-2
  omega_ratio = 0.5
  k           = 0.09817477042468103   # 2pi/64
  B0          = 0.0
  B0_perp     = 1.0
  temperature = 0.0
  density     = 0.0
  use_grad_a_cross_e = false

[output]
  interval_time = 0.05
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "J", "divE"]

    [output.fields.smoothing]
      order  = 3
      method = "spline"

  [output.stats]
    enable        = true
    interval_time = 0.5

[diagnostics]
  log_level = "VERBOSE"
