# =============================================================================
# Stage 3 - η_J = 0.5 (mild sub-critical), A=1.0, K=0.2, 2λ in box
# =============================================================================
# Control parameters:
#   epsilon_a = 0.5
#   A         = omega_a/omega_p = 1.0
#   K         = k * d_e         = 0.2
#   sigma     = B0^2/(n_tot*m_e*c^2) = 1
#
# Charge/current supply ratios:
#   eta_J   = epsilon * A * sqrt(sigma) = 0.5
#   eta_rho = epsilon * K * sqrt(sigma) = 0.10
# =============================================================================

[simulation]
  name    = "stage3_eta0.5"
  engine  = "SRPIC"
  runtime = 400.0

[grid]
  resolution = [2048]
  extent     = [[0.0, 62.831853]]   # L = 4*pi/k = 2*lambda

  [grid.metric]
    metric = "Minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  current_filters = 16

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0 = 32.0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 600000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 600000.0

[setup]
  epsilon     = 0.5       # eta_J = 0.5
  omega       = 1.0       # A = 1.0
  k           = 0.2
  B0          = 1.0
  theta       = 0.0
  temperature = 0.01

[output]
  interval_time = 0.1
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "J", "T00"]

    [output.fields.smoothing]
      order  = 0
      method = "const"

  [output.particles]
    enable = true
    interval_time = 10.0

  [output.spectra]
    enable        = true
    interval_time = 10.0

  [output.stats]
    enable        = true
    interval_time = 1.0

[diagnostics]
  log_level = "VERBOSE"
