# =============================================================================
# Vacuum test T1: adot*B traveling wave (jx1 channel + coef normalization)
# =============================================================================
# density=0, B0=1, k=2pi/64, grad_ae=off.
# Only jx1 = coef*eps*omega*sin(k*x1 - omega*t)*Bx1 acts.
# Analytic: Ex1(x1,t) = -eps*B0*cos(k*x1 - omega*t)  (non-decaying traveling wave)
#           DivE = rho_a*NORM, rho_a = eps*k*B0*sin(k*x1 - omega*t), NORM = skin^2/larmor
# eps=1e-2, B0=1 -> amplitude 1e-2.
# =============================================================================

[simulation]
  name    = "test_adotb_wave"
  engine  = "SRPIC"
  runtime = 7.0            # > one axion period (2pi)

[grid]
  resolution = [512, 8]
  extent     = [[0.0, 64.0], [0.0, 1.0]]   # square cells dx = 0.125; one axion wavelength

  [grid.metric]
    metric = "Minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"], ["PERIODIC"]]
    particles = [["PERIODIC"], ["PERIODIC"]]

[scales]
  larmor0    = 1e-2
  skindepth0 = 0.5        # omega = omega_ratio/skindepth0 = 1.0

[algorithms]
  current_filters = 8

  [algorithms.timestep]
    CFL = 1.413           # Cowan 2D

  [algorithms.fieldsolver]
    delta_x = 0.0
    delta_y = 0.0
    beta_xy = 0.125
    beta_yx = 0.125

[particles]
  ppc0        = 16.0
  use_weights = true

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 100000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 100000.0

[setup]
  epsilon     = 1e-2
  omega_ratio = 0.5
  k           = 0.09817477042468103   # 2pi/64: one wavelength in the box
  B0          = 1.0
  temperature = 0.0
  density     = 0.0       # vacuum
  use_grad_a_cross_e = false

[output]
  interval_time = 0.1
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "J", "divE"]

    [output.fields.smoothing]
      order  = 3
      method = "spline"

  [output.stats]
    enable        = true
    interval_time = 0.5

[diagnostics]
  log_level = "VERBOSE"
