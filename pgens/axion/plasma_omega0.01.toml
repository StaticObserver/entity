# =============================================================================
# Plasma Test — Pair plasma screening of weak axion field
# =============================================================================
# omega_ratio = 0.01 (weak axion, omega << omega_p)
# epsilon = 0.01, k = 0.1, 50 axion periods, 3-wavelength box
#
# eta_rho = epsilon * k * sqrt(sigma) = 0.001
# eta_J   = epsilon * A * sqrt(sigma)   = 0.0001
# Both << 1 → plasma easily screens axion
# =============================================================================

[simulation]
  name    = "plasma_omega0.01"
  engine  = "SRPIC"
  runtime = 31415.926535      # 50 * 2*pi / 0.01

[grid]
  resolution = [3072]         # ~1024 per wavelength
  extent     = [[0.0, 188.495556]]   # 3 * 2*pi/k = 60*pi

  [grid.metric]
    metric = "Minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  current_filters = 0

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0 = 128.0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 600000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 600000.0

[setup]
  epsilon     = 0.01        # g_agamma * a0
  omega_ratio = 0.01        # omega_a / omega_p
  k           = 0.1
  B0          = 1.0
  theta       = 0.0         # B || k
  temperature = 0.01
  density     = 1.0

[output]
  interval_time = 1.0
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "J", "divE", "Charge", "T00"]

    [output.fields.smoothing]
      order  = 1
      method = "spline"

  [output.particles]
    enable        = true
    interval_time = 100.0

  [output.spectra]
    enable        = true
    interval_time = 100.0

  [output.stats]
    enable        = true
    interval_time = 1.0

[diagnostics]
  log_level = "WARNING"
