# =============================================================================
# Stage 2 - σ=1e4: Pair Plasma Screening (ε=1e-2, moderate drive)
# =============================================================================
# Neutral e+e- pair plasma, 1D periodic, B ∥ k ∥ x₁.
# Only ∂_t a · B term in J_a (∇a × E removed).
#
# Control parameters:
#   ε = 1.0e-2, A = ω/ω_p = 0.5, K = k·d_e = 0.1, σ = 1.0e4
#
# Supply ratios:
#   η_J = ε·A·√σ = 1e-2 × 0.5 × 100 = 0.5
#   η_ρ = ε·K·√σ = 1e-2 × 0.1 × 100 = 0.1
# → plasma supply > axion demand, partial screening expected
# =============================================================================

[simulation]
  name    = "stage2_s1e4_eps1e-2"
  engine  = "SRPIC"
  runtime = 400.0

[grid]
  resolution = [1024]
  extent     = [[0.0, 62.831853]]   # L = 2*pi/k

  [grid.metric]
    metric = "Minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 0.01     # σ = (skindepth0/larmor0)² = 1e4
  skindepth0 = 1.0

[algorithms]
  current_filters = 0

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0 = 128.0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 600000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 600000.0

[setup]
  epsilon     = 1.0e-2    # η_J = 0.5, η_ρ = 0.1
  omega_ratio = 0.5       # A = ω_a/ω_p = 0.5
  k           = 0.1
  B0          = 1.0
  theta       = 0.0       # B ∥ k
  temperature = 0.01

[output]
  interval_time = 0.2
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "J", "divE", "T00"]

    [output.fields.smoothing]
      order  = 1
      method = "spline"

  [output.particles]
    enable = true
    interval_time = 10.0

  [output.spectra]
    enable        = true
    interval_time = 10.0

  [output.stats]
    enable        = true
    interval_time = 1.0

[diagnostics]
  log_level = "VERBOSE"
