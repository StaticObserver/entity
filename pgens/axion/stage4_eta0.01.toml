# =============================================================================
# Stage 4 — A=0.01, slow axion / adiabatic screening regime
# ε=1.0, η_J = ε × A = 0.01
# =============================================================================
# Control parameters:
#   A         = omega_a/omega_p = 0.01
#   K         = k * d_e         = 0.2
#   sigma     = B0^2/(n_tot*m_e*c^2) = 1
#   eta_J     = epsilon * A * sqrt(sigma) = 0.01
#   eta_rho   = epsilon * K * sqrt(sigma) = 0.2
#
# Physics: ω_a << ω_p — plasma responds quasi-statically.
#   v_os = ε/A = 100 (vacuum quiver velocity)
#   Plasma screening expected to reduce net E ≪ 1.
# =============================================================================

[simulation]
  name    = "stage4_eta0.01"
  engine  = "SRPIC"
  runtime = 1000.0

[grid]
  resolution = [2048]
  extent     = [[0.0, 62.831853]]   # L = 4*pi/k = 2*lambda

  [grid.metric]
    metric = "Minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  current_filters = 16

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0 = 32.0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 600000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 600000.0

[setup]
  epsilon     = 1.0        # eta_J = epsilon * A = 0.01
  omega       = 0.01       # A = 0.01
  k           = 0.2
  B0          = 1.0
  theta       = 0.0
  temperature = 0.01

[output]
  interval_time = 2.0
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "J", "T00"]

    [output.fields.smoothing]
      order  = 0
      method = "const"

  [output.particles]
    enable = false

  [output.spectra]
    enable = false

  [output.stats]
    enable        = true
    interval_time = 1.0

[diagnostics]
  log_level = "VERBOSE"
