# =============================================================================
# 2D Axion-PIC — uniform transverse B field, vacuum test (no dynamic pair injection)
# =============================================================================
# 2D Minkowski, periodic in x1 and x2.
# Axion propagates along x1: a(t, x1) = cos(k*x1 - omega*t).
#
# B field (uniform):
#   Bx1 = B0        (along axion propagation)
#   Bx2 = B0_perp   (in-plane transverse, constant)
#   Bx3 = 0
#
# E field (Gauss law at t=0):
#   Ex1 = -epsilon * B0 * cos(k * x1),  Ex2 = Ex3 = 0
#
# setup.density = 0  -> vacuum run (no initial plasma).
# Set density > 0 to load a neutral e+e- pair plasma.
# =============================================================================

[simulation]
  name    = "2d_bx2_spectrum"
  engine  = "SRPIC"
  runtime = 200.0

[grid]
  resolution = [512, 512]
  extent     = [[0.0, 188.495559], [0.0, 188.495559]]   # [0, 6*pi/k] x [0, 6*pi/k]

  [grid.metric]
    metric = "Minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"], ["PERIODIC"]]
    particles = [["PERIODIC"], ["PERIODIC"]]

[scales]
  larmor0    = 1e-2     # sigma = (skindepth0/larmor0)^2 = 2500
  skindepth0 = 0.5

[algorithms]
  current_filters = 0

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0        = 16.0
  use_weights = true     # required by axion PGen

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 5000000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 5000000.0

[setup]
  epsilon     = 1e-2
  omega_ratio = 0.5       # A = omega_a / omega_p
  k           = 0.1
  B0          = 1.0
  B0_perp     = 0.05      # uniform transverse Bx2 (in-plane, perpendicular to x1)
  temperature = 0.01
  density     = 1.0       # neutral e+e- pair plasma

[output]
  interval_time = 0.2
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "J", "divE", "T00"]

    [output.fields.smoothing]
      order  = 3
      method = "spline"

  [output.stats]
    enable        = true
    interval_time = 1.0

[diagnostics]
  log_level = "VERBOSE"
