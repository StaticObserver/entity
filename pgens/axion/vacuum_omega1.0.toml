# =============================================================================
# Vacuum Test — No plasma, pure axion-driven EM fields
# =============================================================================
# omega_ratio = 1.0, epsilon = 0.01, k = 0.1
# 20 axion periods, 3-wavelength box
#
# Axion: a(t,x) = cos(k*x - omega*t)
# omega_a = 1.0, T_a = 2*pi/omega_a ≈ 6.283
# =============================================================================

[simulation]
  name    = "vacuum_omega1.0"
  engine  = "SRPIC"
  runtime = 125.663706      # 20 * 2*pi

[grid]
  resolution = [3072]       # ~1024 per wavelength
  extent     = [[0.0, 188.495556]]   # 3 * 2*pi/k = 60*pi

  [grid.metric]
    metric = "Minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  current_filters = 0

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0 = 128.0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 600000.0

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 600000.0

[setup]
  epsilon     = 0.01        # g_agamma * a0
  omega_ratio = 1.0         # omega_a / omega_p
  k           = 0.1
  B0          = 1.0
  theta       = 0.0         # B || k
  temperature = 0.0
  density     = 0.0         # vacuum

[output]
  interval_time = 0.5
  format        = "BPFile"

  [output.fields]
    quantities = ["E", "B", "J", "divE", "Charge", "T00"]

    [output.fields.smoothing]
      order  = 1
      method = "spline"

  [output.particles]
    enable = false           # no particles in vacuum

  [output.spectra]
    enable = false           # no particles → no spectra

  [output.stats]
    enable        = true
    interval_time = 1.0

[diagnostics]
  log_level = "VERBOSE"
