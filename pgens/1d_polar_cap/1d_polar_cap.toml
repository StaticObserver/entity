[simulation]
  name    = "polar_cap_1d"
  engine  = "srpic"
  runtime = 50.0

[grid]
  resolution = [10000]
  extent     = [[0.0, 1.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["ATMOSPHERE", "MATCH"]]
    particles = [["ATMOSPHERE", "ABSORB"]]

    [grid.boundaries.match]
      ds = 0.05

    [grid.boundaries.atmosphere]
      temperature = 0.1
      density     = 1.2
      height      = 0.01
      species     = [1, 2]
      ds          = 0.05

[scales]
  # Reference gyro-radius and skin depth used by Entity's code-unit conversion.
  larmor0    = 4e-4
  skindepth0 = 0.02

[algorithms]
  current_filters = 4

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0                    = 5.0
  # Required by the weighted dilute-tail injector and weighted diagnostics.
  use_weights             = true
  clear_interval          = 100
  spatial_sorting_interval = 0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 1e7
    pusher   = "Boris"
    # QED is disabled below, so Entity must dispatch its no-emission policy.
    emission = "none"

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 1e7
    pusher   = "Boris"
    emission = "none"

[setup]
  # Entity v1.4.4 imports only direct scalar/array children of [setup].
  # Quoted dotted keys preserve the logical namespace without creating nested
  # TOML tables, so the C++ lookup key becomes setup.polar_cap.<name>.
  # Signed background field along x1.
  "polar_cap.B0"                       = -1.0
  # Initial particle temperature; boundary replenishment uses the separate
  # grid.boundaries.atmosphere.temperature value.
  "polar_cap.temperature"              = 0.01
  # Constant tetrad current normalized to n0*q0*c. The PGen converts it to
  # Entity's internal contravariant x1 component by dividing by dx.
  "polar_cap.external_current"         = 0.5
  # Initial E-profile coefficient and excess-positron peak density. Keeping
  # these equal gives the documented continuous initial Gauss closure.
  "polar_cap.initial_e_coefficient"    = 1.0
  "polar_cap.extra_positron_density"   = 1.0

  # Do not inject the excess-positron profile below this density in n0 units.
  "polar_cap.initial_injection.minimum_density" = 1e-6
  # If target_ppc is smaller, inject this fixed count and reduce each
  # macro-particle weight so their total represented density remains exact.
  "polar_cap.initial_injection.minimum_ppc"     = 1

  # PGen-level boundary-flux compensation (Phase 1 mechanism test). When true,
  # the custom particle update predicts which charged particles the right
  # ABSORB boundary will kill during this push and accumulates the current
  # their final displacement would have deposited; CustomPostStep then applies
  # the missing flux to the last active Ex/Jx faces using the CurrentsAmpere
  # normalization. Requires particles = ABSORB at x1 max.
  # WARNING: superseded by the engine-level flux-conserving absorption (the
  # pusher now clamps boundary crossers and deposits their final displacement
  # before srpic::BoundaryAbsorb kills them). MUST stay false with the current
  # engine, otherwise the flux is counted twice.
  "polar_cap.boundary_flux_compensation.enable" = false

  # Aperture4-style multiplicative damping of the longitudinal E_x inside the
  # right MATCH layer, applied once per step in CustomPostStep (after the
  # engine's MATCH(Bx) and Ampere passes). Suppresses the honest-sheath Ex
  # that hard particle absorption leaves at the edge. Only Ex1 on the last
  # `cells` active faces is scaled, by the cubic profile
  # factor(d) = 1 - strength * ((cells - d)/cells)^3 with d the distance in
  # active faces from the last active face (strongest at the edge, unity at
  # d = cells). Requires fields = MATCH at x1 max; the engine's MATCH boundary
  # keeps handling Bx1 alone. cells must be <= ni1 and strength in (0, 1).
  "polar_cap.boundary_ex_damping.enable"   = false
  "polar_cap.boundary_ex_damping.cells"    = 20
  "polar_cap.boundary_ex_damping.strength" = 0.1

  # Keep the migration baseline inert until the physical normalization is fixed.
  "polar_cap.qed.enable"                        = false
  # Independent process switches; all are also gated by enable.
  "polar_cap.qed.curvature_drag"                = true
  "polar_cap.qed.curvature_emission"            = true
  "polar_cap.qed.magnetic_pair_creation"        = true
  # Positive field-line curvature radius in code length units.
  "polar_cap.qed.rho_c"                         = 1.0
  # Charged-particle Lorentz factor defining the curvature spectrum scale.
  "polar_cap.qed.gamma_emit"                    = 3e4
  # Photon energy is measured in electron-rest-mass units.
  "polar_cap.qed.photon_energy_min"             = 2.0
  # Compatibility coefficient reconstructed from the old QED kernel test:
  # (3/2)^2 sqrt(3/2) / pi sqrt(gamma_pc)
  #   * [(gamma_emit/gamma_rad)^2 gamma_emit]^2,
  # with gamma_rad=6.7e5 and gamma_pc=7.2e7.
  "polar_cap.qed.emission_coefficient"          = 2.6926062e7
  "polar_cap.qed.pair_coefficient"              = 2.6926062e7
  # Positive |B|/B_Q; the sign of setup.polar_cap.B0 is not used here.
  "polar_cap.qed.b_over_bq"                     = 1.0
  # Cap emitted macro-particles per parent and carry excess multiplicity
  # through macro-particle weight.
  "polar_cap.qed.max_photons_per_particle_step" = 100
  # Limit continuous recoil so one timestep cannot remove all momentum.
  "polar_cap.qed.max_drag_fraction"             = 0.2
  # Composite Simpson requires a positive even number of intervals.
  "polar_cap.qed.opacity_substeps"              = 8
  # Compatibility mode: convert deterministically once tau reaches this value.
  "polar_cap.qed.conversion_optical_depth"      = 1.0
  # Resolved from the launch directory, then relative to this PGen.
  "polar_cap.qed.spectrum_table"                = "data/curvature_ccdf.tsv"

[output]
  format        = "bp"
  interval_time = 1.0

  [output.fields]
    quantities = ["N_1", "N_2", "E", "B", "J"]

    [output.fields.smoothing]
      # Match the third-order particle shape used by the production build.
      method = "spline"
      order  = 3

  [output.particles]
    enable = false

  [output.spectra]
    enable = false

[diagnostics]
  interval        = 50
  colored_stdout  = true
  blocking_timers = true

[checkpoint]
  keep = 0
