[simulation]
  name    = "polar_cap_realistic_qedoff_edge_start_2sp_extneg_atm30de_n100_ppc100_r20k_r50_shape3"
  engine  = "srpic"
  runtime = 20.0

[grid]
  resolution = [20000]
  extent     = [[0.0, 2.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["ATMOSPHERE", "MATCH"]]
    particles = [["ATMOSPHERE", "ABSORB"]]

    [grid.boundaries.match]
      ds = 0.05

    [grid.boundaries.atmosphere]
      temperature = 0.1
      density     = 100.0
      # The neutral electron-plus-positron density, independent of the excess
      # positron component, is exactly 1.0 at the atmosphere edge:
      #   100 * exp(-0.6 / height) = 1.
      height      = 0.130288344571
      species     = [1, 2]
      ds          = 0.6

[scales]
  # Reference gyro-radius and skin depth used by Entity's code-unit conversion.
  larmor0    = 4e-4
  skindepth0 = 0.02

[algorithms]
  current_filters = 32

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0                     = 200.0
  # Required by the weighted dilute-tail injector and weighted diagnostics.
  use_weights              = true
  clear_interval           = 100
  spatial_sorting_interval = 0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 1e8
    pusher   = "Boris"
    # With QED disabled, this dispatches Entity's no-emission policy and no
    # photon destination species is allocated.
    emission = "none"

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 1e8
    pusher   = "Boris"
    emission = "none"

[setup]
  # Entity v1.4.4 imports only direct scalar/array children of [setup].
  # Quoted dotted keys preserve the logical namespace without creating nested
  # TOML tables, so the C++ lookup key becomes setup.polar_cap.<name>.
  "polar_cap.B0"                       = -1.0
  "polar_cap.temperature"              = 0.01
  # Constant tetrad-basis current. The PGen converts it to the x1 coordinate
  # basis before Ampere's law consumes the callback value.
  "polar_cap.external_current"         = -0.6
  "polar_cap.initial_e_coefficient"    = 1.0
  "polar_cap.extra_positron_density"   = 1.0

  "polar_cap.initial_injection.minimum_density" = 1e-6
  "polar_cap.initial_injection.minimum_ppc"     = 1

  # QED is disabled and the particle list intentionally has no photon species.
  "polar_cap.qed.enable"                        = false
  "polar_cap.qed.curvature_drag"                = true
  "polar_cap.qed.curvature_emission"            = true
  "polar_cap.qed.magnetic_pair_creation"        = true
  "polar_cap.qed.rho_c"                         = 1.0
  "polar_cap.qed.gamma_emit"                    = 3e4
  "polar_cap.qed.photon_energy_min"             = 2.0
  "polar_cap.qed.emission_coefficient"          = 2.6926062e7
  "polar_cap.qed.pair_coefficient"              = 2.6926062e7
  "polar_cap.qed.b_over_bq"                     = 1.0
  "polar_cap.qed.max_photons_per_particle_step" = 100
  "polar_cap.qed.max_drag_fraction"             = 0.2
  "polar_cap.qed.opacity_substeps"              = 8
  "polar_cap.qed.conversion_optical_depth"      = 1.0
  # This path remains part of the QED-on contract but is not opened when QED
  # is disabled.
  "polar_cap.qed.spectrum_table"                = "data/curvature_ccdf.tsv"

[output]
  format        = "bp"
  interval_time = 0.05

  [output.fields]
    quantities = ["N_1", "N_2", "E", "B", "J"]

    [output.fields.smoothing]
      # Keep diagnostic moments consistent with the third-order particle shape.
      method = "spline"
      order  = 3

  [output.particles]
    enable  = true
    species = [1, 2]
    stride  = 100

  [output.spectra]
    enable   = true
    e_min    = 1e-3
    e_max    = 1e3
    log_bins = true
    n_bins   = 256

[diagnostics]
  interval        = 1000
  colored_stdout  = true
  blocking_timers = true

[checkpoint]
  keep = 0
