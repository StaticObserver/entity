# Filled-start experiment E1: isolate the initial-condition effect.
# Baseline: 1x nodamp jm1p5 production input (realistic card). The only
# physics change is the CPT2024-style plasma-filled, Gauss-consistent start
# (E_x = 0, uniform neutral fill 10 n_GJ, net charge = rho_GJ everywhere).
# Atmosphere (100 n_GJ) and external current (j = 1.5 j_GJ) stay at baseline.

[simulation]
  name    = "polar_cap_qedon_filled_start_e1_ic_nodamp_jm1p5"
  engine  = "srpic"
  runtime = 10.0

[grid]
  resolution = [20000]
  extent     = [[0.0, 2.0113993789442053]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["ATMOSPHERE", "MATCH"]]
    particles = [["ATMOSPHERE", "ABSORB"]]

    [grid.boundaries.match]
      ds = 0.1

    [grid.boundaries.atmosphere]
      temperature = 0.1
      density     = 100.0
      height      = 0.0013028834457097555
      species     = [1, 2]
      ds          = 0.006

[scales]
  larmor0    = 1.6905352425172483e-13
  skindepth0 = 2.0e-4

[algorithms]
  current_filters = 16

  [algorithms.timestep]
    CFL = 0.25

[particles]
  ppc0                     = 5.0
  use_weights              = true
  clear_interval           = 10
  spatial_sorting_interval = 0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 4e8
    pusher   = "Boris"
    emission = "custom"

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 4e8
    pusher   = "Boris"
    emission = "custom"

  [[particles.species]]
    label           = "gamma"
    mass            = 0.0
    charge          = 0.0
    maxnpart        = 5e8
    pusher          = "Photon"
    emission        = "none"
    clear_interval  = 0
    n_payloads_real = 3

[setup]
  "polar_cap.B0"                       = -1.0
  "polar_cap.temperature"              = 0.01
  "polar_cap.external_current"         = -1.5
  "polar_cap.initial_e_coefficient"    = 4.2263381062931205e-6
  "polar_cap.extra_positron_density"   = 1.0

  # Filled start: E_x = 0, deposited net charge = rho_GJ pointwise,
  # uniform neutral bulk fill of 10 n_GJ across the active domain.
  "polar_cap.initial_condition"                 = "filled"
  "polar_cap.initial_injection.fill_density"    = 10.0
  "polar_cap.rho_gj_gradient"                   = 0.0

  "polar_cap.initial_injection.minimum_density" = 1e-6
  "polar_cap.initial_injection.minimum_ppc"     = 1

  # Phase-1 validation: compensate the outflow current of absorbed
  # particles at the right ABSORB boundary (dev/flux-conserving-absorb).
  # Must stay false with the engine kill-after-deposit fix (double counting).
  "polar_cap.boundary_flux_compensation.enable" = false

  # Timokhin-style free boundary: NO field condition at the right edge;
  # only the engine kill-after-deposit fix keeps the escaping-particle
  # current deposition correct.  Ex damping stays off.
  "polar_cap.boundary_ex_damping.enable"   = false
  "polar_cap.boundary_ex_damping.cells"    = 1000
  "polar_cap.boundary_ex_damping.strength" = 0.1

  "polar_cap.qed.enable"                        = true
  "polar_cap.qed.curvature_drag"                = true
  "polar_cap.qed.curvature_emission"            = true
  "polar_cap.qed.magnetic_pair_creation"        = true
  "polar_cap.qed.filter_nonconverting_photons"  = true
  "polar_cap.qed.photon_recycle_interval"       = 10
  "polar_cap.qed.rho_c"                         = 99.1801871615959
  "polar_cap.qed.gamma_emit"                    = 55834.90547704259
  "polar_cap.qed.gamma_rad"                     = 1.2746430986838872e7
  "polar_cap.qed.reference_electric_field"      = 8.452676212586241e-6
  "polar_cap.qed.photon_energy_min"             = 2.0
  "polar_cap.qed.emission_coefficient"          = 4.400209034170457e8
  "polar_cap.qed.pair_coefficient"              = 7.00315018425844e7
  "polar_cap.qed.b_over_bq"                     = 2.2655188038060717e-2
  "polar_cap.qed.max_photons_per_particle_step" = 100
  "polar_cap.qed.max_drag_fraction"             = 0.2
  "polar_cap.qed.opacity_substeps"              = 8
  "polar_cap.qed.conversion_optical_depth"      = 1.0
  "polar_cap.qed.spectrum_table"                = "data/curvature_ccdf.tsv"

  "polar_cap.radiation_reaction.enable" = false

[output]
  format        = "bp"
  interval_time = 0.02

  [output.fields]
    quantities = ["N_1", "N_2", "N_3", "E", "B", "J"]

    [output.fields.smoothing]
      method = "spline"
      order  = 3

  [output.particles]
    enable  = true
    species = [1, 2, 3]
    stride  = 1000

  [output.spectra]
    enable   = true
    e_min    = 1e0
    e_max    = 1e8
    log_bins = true
    n_bins   = 512

[diagnostics]
  interval        = 500
  colored_stdout  = true
  blocking_timers = true

[checkpoint]
  keep = 0
