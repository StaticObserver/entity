[simulation]
  name    = "polar_cap_qedon_j1p5_degj5dx_r20k_test"
  engine  = "srpic"
  # Bounded first QED-on measurement: 8000 steps at dt=2.5e-5.
  runtime = 0.2

[grid]
  resolution = [20000]
  extent     = [[0.0, 2.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["ATMOSPHERE", "MATCH"]]
    particles = [["ATMOSPHERE", "ABSORB"]]

    [grid.boundaries.match]
      ds = 0.05

    [grid.boundaries.atmosphere]
      temperature = 0.1
      density     = 100.0
      height      = 0.130288344571
      species     = [1, 2]
      ds          = 0.6

[scales]
  # R_PC=2, dx=1e-4, d_e^GJ=5 dx, and gamma_PC=8e6.
  larmor0    = 2.5e-7
  skindepth0 = 5.0e-4

[algorithms]
  current_filters = 32

  [algorithms.timestep]
    CFL = 0.25

[particles]
  ppc0                     = 50.0
  use_weights              = true
  clear_interval           = 100
  spatial_sorting_interval = 0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 1e8
    pusher   = "Boris"
    emission = "custom"

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 1e8
    pusher   = "Boris"
    emission = "custom"

  [[particles.species]]
    label           = "gamma"
    mass            = 0.0
    charge          = 0.0
    maxnpart        = 1e8
    pusher          = "Photon"
    emission        = "none"
    # epsilon_gamma, tau_pair, theta_B
    n_payloads_real = 3

[setup]
  "polar_cap.B0"                       = -1.0
  "polar_cap.temperature"              = 0.01
  "polar_cap.external_current"         = 1.5
  "polar_cap.initial_e_coefficient"    = 1.0
  "polar_cap.extra_positron_density"   = 1.0

  "polar_cap.initial_injection.minimum_density" = 1e-6
  "polar_cap.initial_injection.minimum_ppc"     = 1

  "polar_cap.qed.enable"                        = true
  "polar_cap.qed.curvature_drag"                = true
  "polar_cap.qed.curvature_emission"            = true
  "polar_cap.qed.magnetic_pair_creation"        = true
  "polar_cap.qed.rho_c"                         = 10.0
  "polar_cap.qed.gamma_emit"                    = 1.6e4
  "polar_cap.qed.gamma_rad"                     = 1.6e5
  "polar_cap.qed.reference_electric_field"      = 2.0
  "polar_cap.qed.photon_energy_min"             = 2.0
  "polar_cap.qed.emission_coefficient"          = 6.351308875e7
  "polar_cap.qed.pair_coefficient"              = 6.351308875e7
  "polar_cap.qed.b_over_bq"                     = 0.2
  "polar_cap.qed.max_photons_per_particle_step" = 100
  "polar_cap.qed.max_drag_fraction"             = 0.2
  "polar_cap.qed.opacity_substeps"              = 8
  "polar_cap.qed.conversion_optical_depth"      = 1.0
  "polar_cap.qed.spectrum_table"                = "data/curvature_ccdf.tsv"

  # Explicit RR is a separate QED-off mode and must remain disabled here.
  "polar_cap.radiation_reaction.enable" = false

[output]
  format        = "bp"
  interval_time = 0.0025

  [output.fields]
    quantities = ["N_1", "N_2", "N_3", "E", "B", "J"]

    [output.fields.smoothing]
      method = "spline"
      order  = 3

  [output.particles]
    enable  = true
    species = [1, 2, 3]
    stride  = 200

  [output.spectra]
    enable   = true
    e_min    = 1e0
    e_max    = 1e7
    log_bins = true
    n_bins   = 512

[diagnostics]
  interval        = 500
  colored_stdout  = true
  blocking_timers = true

[checkpoint]
  keep = 0
