# QED-on smoke test: minimal grid, short runtime, all QED processes enabled.
# Goal: confirm compilation + first-timestep emission/opacity/conversion.

[simulation]
  name    = "polar_cap_qedon_smoke"
  engine  = "srpic"
  runtime = 1.0

[grid]
  resolution = [256]
  extent     = [[0.0, 2.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["ATMOSPHERE", "MATCH"]]
    particles = [["ATMOSPHERE", "ABSORB"]]

    [grid.boundaries.match]
      ds = 0.05

    [grid.boundaries.atmosphere]
      temperature = 0.1
      density     = 100.0
      height      = 0.130288344571
      species     = [1, 2]
      ds          = 0.6

[scales]
  larmor0    = 4e-4
  skindepth0 = 0.02

[algorithms]
  current_filters = 4

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0                     = 50.0
  use_weights              = true
  clear_interval           = 100
  spatial_sorting_interval = 0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 50000
    pusher   = "Boris"
    emission = "custom"

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 50000
    pusher   = "Boris"
    emission = "custom"

  # Photon species — required for QED curvature emission + pair conversion.
  [[particles.species]]
    label           = "gamma"
    mass            = 0.0
    charge          = 0.0
    maxnpart        = 100000
    pusher          = "Photon"
    emission        = "none"
    # CustomPostStep reclaims photons after pair conversion.
    clear_interval  = 0
    n_payloads_real = 3

[setup]
  "polar_cap.B0"                       = -1.0
  "polar_cap.temperature"              = 0.01
  "polar_cap.external_current"         = -0.6
  "polar_cap.initial_e_coefficient"    = 1.0
  "polar_cap.extra_positron_density"   = 1.0

  "polar_cap.initial_injection.minimum_density" = 1e-6
  "polar_cap.initial_injection.minimum_ppc"     = 1

  # QED ENABLED — all three processes active.
  "polar_cap.qed.enable"                        = true
  "polar_cap.qed.curvature_drag"                = true
  "polar_cap.qed.curvature_emission"            = true
  "polar_cap.qed.magnetic_pair_creation"        = true
  "polar_cap.qed.filter_nonconverting_photons"  = true
  "polar_cap.qed.photon_recycle_interval"       = 10
  "polar_cap.qed.rho_c"                         = 1.0
  "polar_cap.qed.gamma_emit"                    = 3e4
  "polar_cap.qed.photon_energy_min"             = 2.0
  "polar_cap.qed.emission_coefficient"          = 2.6926062e7
  "polar_cap.qed.pair_coefficient"              = 2.6926062e7
  "polar_cap.qed.b_over_bq"                     = 1.0
  "polar_cap.qed.max_photons_per_particle_step" = 100
  "polar_cap.qed.max_drag_fraction"             = 0.2
  "polar_cap.qed.opacity_substeps"              = 8
  "polar_cap.qed.conversion_optical_depth"      = 1.0
  "polar_cap.qed.spectrum_table"                = "data/curvature_ccdf.tsv"

[output]
  format        = "disabled"
  interval_time = 1.0

  [output.fields]
    quantities = ["N_1", "N_2", "N_3", "E", "B", "J"]

    [output.fields.smoothing]
      method = "spline"
      order  = 3

  [output.particles]
    enable = false

  [output.spectra]
    enable = false

[diagnostics]
  interval        = 1
  colored_stdout  = true
  blocking_timers = true

[checkpoint]
  keep = 0
