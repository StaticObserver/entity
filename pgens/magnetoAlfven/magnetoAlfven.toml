[simulation]
  name    = "alfven"
  engine  = "srpic"
  runtime = 50.0

[grid]
  resolution = [2048, 1024]
  extent     = [[1.0, 50.0]]

  [grid.metric]
    metric = "qspherical"

  [grid.boundaries]
    fields    = [["ATMOSPHERE", "MATCH"]]
    particles = [["ATMOSPHERE", "ABSORB"]]

    [grid.boundaries.absorb]
      ds = 1.0

    [grid.boundaries.atmosphere]
      temperature = 0.1
      density     = 0.0
      height      = 0.02
      species     = [1, 2]
      ds          = 2.0

[scales]
  larmor0    = 2e-5
  skindepth0 = 0.01

[algorithms]
  current_filters = 16

  [algorithms.timestep]
    CFL = 0.5

  [algorithms.gca]
    e_ovr_b_max = 0.9
    larmor_max  = 1.0

[particles]
  ppc0           = 12.0
  use_weights    = true
  clear_interval = 100

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 1e8
    pusher   = "Boris,GCA"

  [[particles.species]]
    label    = "e+"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 1e8
    pusher   = "Boris,GCA"

[setup]
  Bsurf          = 1.0
  field_geometry = "dipole" # can be "dipole" or "monopole" (default: dipole)
  N0             = 1.0
  Omega          = 0.0
  temperature    = 0.1

[output]
  format = "BPFile"

  [output.fields]
    interval_time = 0.2
    quantities    = ["N_1", "N_2", "E", "B"]

  [output.particles]
    enable = false

  [output.spectra]
    enable = false
